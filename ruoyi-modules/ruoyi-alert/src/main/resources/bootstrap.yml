# Tomcat
server:
  port: 9211

# Spring
spring:
  application:
    name: ruoyi-alert
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 8.145.45.204:8848
      config:
        server-addr: 8.145.45.204:8848
  config:
    file-extension: yml
    import:
      # 业务配置统一由 Nacos 配置中心下发（data_id: ruoyi-alert-dev.yml）
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
