# Tomcat
server:
  port: 9211

# Spring
spring:
  application:
    name: ruoyi-alert
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
  config:
    file-extension: yml
    import:
      # 业务模块配置本地自持，Nacos 配置可选覆盖
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
