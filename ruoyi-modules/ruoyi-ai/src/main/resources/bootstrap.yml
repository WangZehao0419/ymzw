# Tomcat
server:
  port: 9212

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-ai
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 8.145.45.204:8848
      config:
        # 配置中心地址
        server-addr: 8.145.45.204:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      # 业务配置统一由 Nacos 配置中心下发（data_id: ruoyi-ai-dev.yml）
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
