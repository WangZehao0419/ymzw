spring:
  # 数据源配置（业务模块自持，不依赖 Nacos 共享的 Druid 配置）
  # Druid 连接池(prefix: spring.datasource.druid,与 RuoYi-Cloud 标准对齐)
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ry-cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123!@#QWer}
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      connect-timeout: 30000
      socket-timeout: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # AI配置（通过 Spring AI OpenAI 兼容接口）
  # 当前使用：阿里云百练平台（DashScope）
  # 如需切换 DeepSeek，将 base-url 改为 https://api.deepseek.com 并调整 model
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${AI_API_KEY:sk-dde4aa6baf9844b38c8c9e7c555c654f}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ruoyi.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.ruoyi.ai: debug
